name: prepare-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Normalize version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $INPUT_VERSION" >&2
            exit 2
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists" >&2
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - name: Prepare version and changelog
        run: scripts/prepare-release.sh "${{ steps.version.outputs.value }}"
      - name: Run complete desktop checks
        env:
          DESKTOP_TERMINAL_TESTS: "1"
        run: bash scripts/check.sh
      - name: Commit and tag prepared source
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mygo.json main.go CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No release source changes were prepared" >&2
            exit 1
          fi
          git commit -m "chore: release v${VERSION}"
          git diff --exit-code
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
