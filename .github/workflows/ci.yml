name: Desktop checks
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format and lint checks
        shell: bash
        run: |
          unformatted="$(gofmt -l main.go internal cmd locales tests)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following Go files need gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet ./...
      - name: Syntax check scripts
        shell: bash
        run: bash -n scripts/*.sh tests/*.sh
      - name: Git diff checks
        shell: bash
        run: git diff --check

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
          - os: ubuntu-latest
            goos: linux
          - os: windows-latest
            goos: windows
    runs-on: ${{ matrix.os }}
    # Hosted runners can take about 18 minutes for the full headless UI
    # package before the installer and native acceptance probes run.
    timeout-minutes: 35
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Keep a diagnosable artifact even when the package checks fail before
      # the native acceptance step can create its evidence directory. The
      # acceptance scripts replace this marker with their real records.
      - name: Prepare native evidence directory (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          DESKTOP_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/agent-remote-desktop-native
        run: |
          mkdir -p "$DESKTOP_NATIVE_EVIDENCE_DIR"
          printf 'native acceptance step has not started\n' > "$DESKTOP_NATIVE_EVIDENCE_DIR/preflight.txt"
      - name: Prepare native evidence directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DESKTOP_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/agent-remote-desktop-native
        run: |
          New-Item -ItemType Directory -Force -Path $env:DESKTOP_NATIVE_EVIDENCE_DIR | Out-Null
          Set-Content -Encoding utf8 -Path (Join-Path $env:DESKTOP_NATIVE_EVIDENCE_DIR 'preflight.txt') -Value 'native acceptance step has not started'
      - name: Linux native UI dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq
          libgtk-3-0 libgl1 libegl1 libwebkit2gtk-4.1-0
          libayatana-appindicator3-1 dbus-x11 xvfb
      - name: Catalog, layout, unit and PTY checks
        shell: bash
        env:
          DESKTOP_TERMINAL_TESTS: "1"
        run: bash scripts/check.sh
      - name: Native installer upgrade and rollback probe
        shell: bash
        run: go run ./tests/installer-probe
      - name: Runtime-only host acceptance evidence
        if: runner.os != 'Windows'
        shell: bash
        env:
          DESKTOP_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/agent-remote-desktop-native
        run: scripts/native-acceptance.sh --target "${{ matrix.goos }}"
      - name: Runtime-only host acceptance evidence (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DESKTOP_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/agent-remote-desktop-native
        run: ./scripts/native-acceptance.ps1 -EvidenceDir "$env:DESKTOP_NATIVE_EVIDENCE_DIR" -Target "${{ matrix.goos }}"
      - name: Upload runtime-only host acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/agent-remote-desktop-native
          # A missing directory must fail the host job instead of allowing a
          # later verifier to mistake a missing runner record for success.
          if-no-files-found: error
      - run: go build .

  cross-build:
    name: Cross-build (no runtime evidence) ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build desktop and installer for target
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build ./...
          mkdir -p "$RUNNER_TEMP/agent-remote-desktop-cross"
          installer="$RUNNER_TEMP/agent-remote-desktop-cross/agent-remote-desktop-installer"
          if [[ "$GOOS" == windows ]]; then installer+=".exe"; fi
          go build -trimpath -o "$installer" ./cmd/release-installer
          test -s "$installer"

  verify-native-evidence:
    name: Verify native acceptance evidence
    # Each runner records its own host-only evidence.  Keep this as a separate
    # job so a green runner cannot silently become the release gate without
    # proving that all three target hosts produced a complete record.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS host evidence
        uses: actions/download-artifact@v4
        with:
          name: native-acceptance-macos-latest
          path: ${{ runner.temp }}/native-evidence/macos
      - name: Download Windows host evidence
        uses: actions/download-artifact@v4
        with:
          name: native-acceptance-windows-latest
          path: ${{ runner.temp }}/native-evidence/windows
      - name: Download Linux host evidence
        uses: actions/download-artifact@v4
        with:
          name: native-acceptance-ubuntu-latest
          path: ${{ runner.temp }}/native-evidence/linux
      - name: Verify all host records
        shell: bash
        run: >-
          scripts/verify-native-evidence.sh
          --allow-virtual-display
          "${{ runner.temp }}/native-evidence/macos"
          "${{ runner.temp }}/native-evidence/windows"
          "${{ runner.temp }}/native-evidence/linux"
